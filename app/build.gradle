apply plugin: 'com.android.application'

def config = new Properties()
rootProject.file('app-config.properties').withInputStream { config.load(it) }

android {
    namespace "com.mycompany.myapp"
    compileSdkVersion config.COMPILE_SDK.toInteger()
    androidResources {
        noCompress += ["ogg", "wav"]
    }

    defaultConfig {
        applicationId "com.mycompany.myapp"
        minSdkVersion config.MIN_SDK.toInteger()
        targetSdkVersion config.TARGET_SDK.toInteger()
        versionCode config.VERSION_CODE.toInteger()
        versionName config.VERSION_NAME
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // Share the existing local key with the Termux build when available.
    signingConfigs {
        persistentDebug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            if (rootProject.file('debug.keystore').exists()) {
                signingConfig signingConfigs.persistentDebug
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
